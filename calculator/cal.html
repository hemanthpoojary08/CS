<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="cal.css">
</head>

<body>
    <h2>Calculator</h2>
    <table border="1" align="center">
        <tr>
            <td colspan="4"><input type="text" id="disp" disabled></td>
        </tr>
        <tr>
            <td><input type="button" id="num" value=7 onclick="Show(this.value)"></td>
            <td><input type="button" id="num" value=8 onclick="Show(this.value)"></td>
            <td><input type="button" id="num" value=9 onclick="Show(this.value)"></td>
            <td><input type="button" id="add" value=+ onclick="Show(this.value)"></td>
        </tr>
        <tr>
            <td><input type="button" id="num" value=4 onclick="Show(this.value)"></td>
            <td><input type="button" id="num" value=5 onclick="Show(this.value)"></td>
            <td><input type="button" id="num" value=6 onclick="Show(this.value)"></td>
            <td><input type="button" id="add" value=- onclick="Show(this.value)"></td>
        </tr>
        <tr>
            <td><input type="button" id="num" value=1 onclick="Show(this.value)"></td>
            <td><input type="button" id="num" value=2 onclick="Show(this.value)"></td>
            <td><input type="button" id="num" value=3 onclick="Show(this.value)"></td>
            <td><input type="button" id="add" value=* onclick="Show(this.value)"></td>
        </tr>
        <tr>
            <td><input type="button" id="num" value=. onclick="Show(this.value)"></td>
            <td><input type="button" id="num" value=0 onclick="Show(this.value)"></td>
            <td><input type="button" id="num" value=C onclick="Clear()"></td>
            <td><input type="button" id="add" value=/ onclick="Show(this.value)"></td>
        </tr>
        <tr>
            <td colspan="4">
                <input type="button" id="equal" value="=" onclick="Calculate()">
            </td>
        </tr>
    </table>
    <script src="cal.js"></script>
</body>

</html>
